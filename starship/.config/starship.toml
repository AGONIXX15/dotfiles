"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 500

format = """
$directory$git_branch$git_status$python$nodejs$rust$golang$lua$haskell$cmd_duration
$character"""

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 2000
style = "dimmed white"
format = "[󰔟 $duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "cyan"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "green"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "red"

[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "cyan"

[lua]
symbol = " "
format = "[$symbol$version]($style) "
style = "blue"

[haskell]
symbol = " "
format = "[$symbol$version]($style) "
style = "purple"
