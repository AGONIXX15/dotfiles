source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.cache/current_wall
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
}

# hora y minutos en dos líneas
label {
    monitor =
    text = cmd[update:1000] date +%H
    color = $on_surface
    font_size = 170
    font_family = JetBrainsMono Nerd Font Thin
    position = 0, 290
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +%M
    color = $primary
    font_size = 170
    font_family = JetBrainsMono Nerd Font Thin
    position = 0, 110
    halign = center
    valign = center
}

# saludo según la hora
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/greeting.sh
    color = $on_surface
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# canción actual
label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '󰎆  {{artist}} - {{title}}' 2>/dev/null
    color = $on_surface
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    capslock_color = $error
    placeholder_text = <i>Contraseña...</i>
    fail_text = <i>Incorrecta</i>
    rounding = -1
    dots_center = true
    position = 0, -120
    halign = center
    valign = center
}
